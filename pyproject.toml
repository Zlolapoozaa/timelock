[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timelock-vault"
dynamic = ["version"]
description = "Lock secrets behind hours of unavoidable computation (Rivest-Shamir-Wagner time-lock puzzle)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luca Pessoa" }]
requires-python = ">=3.9"
dependencies = []  # standard library only; gmpy2 is optional
keywords = ["time-lock", "timelock", "time-lock puzzle", "self-control", "screen time", "password", "vault"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

[project.optional-dependencies]
fast = ["gmpy2>=2.1"]
dev = ["pytest>=7", "ruff", "build"]

[project.scripts]
timelock = "timelock:main"

[project.urls]
Homepage = "https://github.com/Zlolapoozaa/timelock"
Issues = "https://github.com/Zlolapoozaa/timelock/issues"
Changelog = "https://github.com/Zlolapoozaa/timelock/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["timelock"]  # one file: the same timelock.py people can download on its own

[tool.setuptools.dynamic]
version = { attr = "timelock.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["tests/legacy/timelock_v1.py"]  # frozen verbatim copy of the original

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["timelock", "helpers", "legacy"]
